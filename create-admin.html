<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Tạo tài khoản Admin trên Firebase</h4>
                    </div>
                    <div class="card-body">
                        <div id="status" class="alert alert-info">
                            Nhấn nút bên dưới để tạo tài khoản admin trên Firebase
                        </div>
                        <button id="createBtn" class="btn btn-primary w-100">
                            Tạo tài khoản Admin
                        </button>
                        <div class="mt-3">
                            <h6>Thông tin tài khoản sẽ tạo:</h6>
                            <ul>
                                <li>Username: <strong>admin1</strong></li>
                                <li>Password: <strong>123456</strong></li>
                                <li>Name: <strong>Administrator</strong></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEEErX_ybhvvi2W_unmIMnZTO4vEGdYE0",
            authDomain: "webbanhang-cc2c7.firebaseapp.com",
            projectId: "webbanhang-cc2c7",
            storageBucket: "webbanhang-cc2c7.appspot.com",
            messagingSenderId: "777103483355",
            appId: "1:777103483355:web:cd03654e7cdad7114ec7fe",
            measurementId: "G-B138HGZSQ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `alert alert-${type}`;
            statusDiv.innerHTML = message;
        }

        document.getElementById('createBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang xử lý...';

            try {
                updateStatus('Đang kiểm tra tài khoản admin hiện có...', 'info');

                // Kiểm tra xem đã có admin chưa
                const q = query(collection(db, "admins"), where("username", "==", "admin1"));
                const querySnapshot = await getDocs(q);

                // Xóa admin cũ nếu có
                if (!querySnapshot.empty) {
                    updateStatus('Tìm thấy tài khoản admin cũ, đang xóa...', 'warning');
                    for (const document of querySnapshot.docs) {
                        await deleteDoc(doc(db, "admins", document.id));
                    }
                }

                // Tạo admin mới
                updateStatus('Đang tạo tài khoản admin mới...', 'info');
                const adminData = {
                    username: "admin1",
                    password: "123456",
                    name: "Administrator",
                    role: "admin",
                    createdAt: new Date().toISOString(),
                    lastLogin: null
                };

                const docRef = await addDoc(collection(db, "admins"), adminData);

                updateStatus(`
                    <strong>✅ Tạo tài khoản thành công!</strong><br><br>
                    <strong>Thông tin đăng nhập:</strong><br>
                    - Username: <code>admin1</code><br>
                    - Password: <code>123456</code><br>
                    - ID: <code>${docRef.id}</code><br><br>
                    <a href="admin-login.html" class="btn btn-success">Đến trang đăng nhập</a>
                `, 'success');

                btn.style.display = 'none';
            } catch (error) {
                console.error('Lỗi:', error);
                updateStatus(`<strong>❌ Lỗi:</strong> ${error.message}`, 'danger');
                btn.disabled = false;
                btn.innerHTML = 'Thử lại';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
