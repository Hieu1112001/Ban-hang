<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="index.html"><img src="./asset/img/logo.png" alt="" /></a>
        </div>
        <div class="menu">
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="cart.html">Giỏ hàng</a></li>
            <li><a href="account.html">Tài khoản</a></li>
        </div>
        <div class="others">
            <li><a class="icon-btn cart-icon" href="cart.html"><i class="fas fa-shopping-cart"></i></a></li>
            <li><a class="icon-btn" href="account.html"><i class="fas fa-user"></i></a></li>
        </div>
    </header>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-6">
                <img id="product-image" src="" class="img-fluid" alt="">
            </div>
            <div class="col-md-6">
                <h2 id="product-title"></h2>
                <h3 class="text-danger" id="product-price"></h3>
                <p id="product-description" class="text-muted"></p>
                
                <div class="mb-3">
                    <label class="form-label">Số lượng:</label>
                    <div class="input-group" style="width:150px">
                        <button class="btn btn-outline-secondary" id="decrease-qty">-</button>
                        <input type="number" class="form-control text-center" id="product-qty" value="1" min="1">
                        <button class="btn btn-outline-secondary" id="increase-qty">+</button>
                    </div>
                </div>

                <button class="btn btn-primary btn-lg" id="add-to-cart-btn">
                    <i class="fas fa-shopping-cart"></i> Thêm vào giỏ hàng
                </button>
                <button class="btn btn-success btn-lg ms-2" id="buy-now-btn">
                    Mua ngay
                </button>

                <div class="mt-4">
                    <h5>Đánh giá sản phẩm</h5>
                    <div id="reviews-section"></div>
                    <button class="btn btn-sm btn-outline-primary mt-2" id="add-review-btn">Viết đánh giá</button>
                </div>
            </div>
        </div>

        <!-- Sản phẩm liên quan -->
        <div class="mt-5">
            <h4>Sản phẩm tương tự</h4>
            <div class="row g-3" id="related-products"></div>
        </div>
    </div>

    <!-- Modal đánh giá -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Đánh giá sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="review-form">
                        <div class="mb-3">
                            <label class="form-label">Đánh giá</label>
                            <select class="form-select" id="review-rating" required>
                                <option value="5">⭐⭐⭐⭐⭐ Rất tốt</option>
                                <option value="4">⭐⭐⭐⭐ Tốt</option>
                                <option value="3">⭐⭐⭐ Bình thường</option>
                                <option value="2">⭐⭐ Tệ</option>
                                <option value="1">⭐ Rất tệ</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nhận xét</label>
                            <textarea class="form-control" id="review-content" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Gửi đánh giá</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./common.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (!productId) {
            window.location.href = 'index.html';
        }

        let currentProduct = null;

        // Load sản phẩm từ API hoặc localStorage
        async function loadProduct() {
            if (productId.startsWith('local-')) {
                const localProducts = JSON.parse(localStorage.getItem('admin_products')) || [];
                const idx = parseInt(productId.replace('local-', ''));
                currentProduct = localProducts[idx];
                currentProduct.id = productId;
            } else {
                const response = await fetch(`https://fakestoreapi.com/products/${productId}`);
                currentProduct = await response.json();
            }

            document.getElementById('product-image').src = currentProduct.image;
            document.getElementById('product-title').textContent = currentProduct.title || currentProduct.name;
            document.getElementById('product-price').textContent = currentProduct.price.toLocaleString() + '$';
            document.getElementById('product-description').textContent = currentProduct.description || 'Sản phẩm chất lượng cao';

            loadReviews();
            loadRelatedProducts();
        }

        // Quản lý số lượng
        document.getElementById('decrease-qty').onclick = () => {
            const qty = document.getElementById('product-qty');
            if (qty.value > 1) qty.value = parseInt(qty.value) - 1;
        };
        document.getElementById('increase-qty').onclick = () => {
            const qty = document.getElementById('product-qty');
            qty.value = parseInt(qty.value) + 1;
        };

        // Thêm vào giỏ hàng
        document.getElementById('add-to-cart-btn').onclick = () => {
            const qty = parseInt(document.getElementById('product-qty').value);
            addToCart(currentProduct, qty);
            alert('Đã thêm vào giỏ hàng!');
        };

        // Mua ngay
        document.getElementById('buy-now-btn').onclick = () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                alert('Vui lòng đăng nhập để mua hàng!');
                window.location.href = 'auth.html';
                return;
            }
            document.getElementById('add-to-cart-btn').click();
            window.location.href = 'cart.html';
        };

        // Đánh giá
        function loadReviews() {
            const reviews = JSON.parse(localStorage.getItem('reviews')) || {};
            const productReviews = reviews[productId] || [];
            const section = document.getElementById('reviews-section');
            
            if (productReviews.length === 0) {
                section.innerHTML = '<p class="text-muted">Chưa có đánh giá nào</p>';
                return;
            }

            section.innerHTML = productReviews.map(r => `
                <div class="card mb-2">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <strong>${r.userName}</strong>
                            <span>${'⭐'.repeat(r.rating)}</span>
                        </div>
                        <p class="mb-0 mt-2">${r.content}</p>
                        <small class="text-muted">${new Date(r.date).toLocaleDateString('vi-VN')}</small>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('add-review-btn').onclick = () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                alert('Vui lòng đăng nhập để đánh giá!');
                window.location.href = 'auth.html';
                return;
            }
            const modal = new bootstrap.Modal(document.getElementById('reviewModal'));
            modal.show();
        };

        document.getElementById('review-form').onsubmit = function(e) {
            e.preventDefault();
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const rating = document.getElementById('review-rating').value;
            const content = document.getElementById('review-content').value.trim();

            const reviews = JSON.parse(localStorage.getItem('reviews')) || {};
            if (!reviews[productId]) reviews[productId] = [];
            
            reviews[productId].push({
                userName: currentUser.name,
                rating: parseInt(rating),
                content,
                date: new Date().toISOString()
            });

            localStorage.setItem('reviews', JSON.stringify(reviews));
            loadReviews();
            bootstrap.Modal.getInstance(document.getElementById('reviewModal')).hide();
            this.reset();
        };

        // Sản phẩm liên quan
        async function loadRelatedProducts() {
            const response = await fetch('https://fakestoreapi.com/products?limit=4');
            const products = await response.json();
            const container = document.getElementById('related-products');
            
            container.innerHTML = products.filter(p => p.id != productId).slice(0, 4).map(p => `
                <div class="col-md-3">
                    <div class="card h-100">
                        <img src="${p.image}" class="card-img-top p-3" style="height:200px;object-fit:contain">
                        <div class="card-body">
                            <h6 class="card-title">${p.title.substring(0, 50)}...</h6>
                            <p class="text-danger fw-bold">${p.price.toLocaleString()}$</p>
                            <a href="product-detail.html?id=${p.id}" class="btn btn-sm btn-primary">Xem chi tiết</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        loadProduct();
    </script>
</body>
</html>
