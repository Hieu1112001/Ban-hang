<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-storage.js" type="module"></script>
    <script src="https://unpkg.com/@imagekit/javascript@5.0.0/dist/imagekit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4">Quản trị sản phẩm</h1>
        <div class="card mb-4">
            <div class="card-header">Thêm sản phẩm mới</div>
            <div class="card-body">
                <form id="add-product-form" class="row g-3" enctype="multipart/form-data">
                    <div class="col-md-4">
                        <label class="form-label">Tên sản phẩm</label>
                        <input type="text" class="form-control" id="productName" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Giá</label>
                        <input type="number" class="form-control" id="productPrice" required min="0">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Danh mục</label>
                        <select id="productCategory" class="form-select" required>
                            <option value="nu">Nữ</option>
                            <option value="nam">Nam</option>
                            <option value="tre-em">Trẻ em</option>
                        </select>
                   </div>
                    <div class="col-md-4">
                        <label class="form-label">Ảnh (jpg, png)</label>
                        <input type="file" class="form-control" id="productImage" accept="image/png, image/jpeg"
                            required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Thêm</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-header">Danh sách sản phẩm</div>
            <div class="card-body">
                <table class="table table-bordered align-middle" id="product-table">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">Đơn hàng đã thanh toán</div>
            <div class="card-body">
                <table class="table table-bordered align-middle" id="order-table">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Ngày đặt hàng</th>
                            <th>Khách hàng</th>
                            <th>SĐT</th>
                            <th>Địa chỉ</th>
                            <th>Phương thức</th>
                            <th>Sản phẩm</th>
                            <th>Tổng tiền</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="toastSuccess" class="toast align-items-center text-bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Thêm sản phẩm thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

        <div id="toastError" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Có lỗi xảy ra khi thêm sản phẩm!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Modal sửa sản phẩm -->
    <div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProductModalLabel">Sửa sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-product-form">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label class="form-label">Tên sản phẩm</label>
                            <input type="text" class="form-control" id="editProductName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá</label>
                            <input type="number" class="form-control" id="editProductPrice" required min="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Danh mục</label>
                            <select id="editProductCategory" class="form-select" required>
                                <option value="nu">Nữ</option>
                                <option value="nam">Nam</option>
                                <option value="tre-em">Trẻ em</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ảnh mới (để trống nếu không đổi)</label>
                            <input type="file" class="form-control" id="editProductImage" accept="image/png, image/jpeg">
                        </div>
                        <div class="mb-3" id="currentImageContainer">
                            <label class="form-label">Ảnh hiện tại</label>
                            <div>
                                <img id="currentImage" src="" style="max-width: 200px; height: auto;">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
