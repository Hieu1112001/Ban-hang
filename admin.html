<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4">Quản trị sản phẩm</h1>
        <div class="card mb-4">
            <div class="card-header">Thêm sản phẩm mới</div>
            <div class="card-body">
                <form id="add-product-form" class="row g-3" enctype="multipart/form-data">
                    <div class="col-md-4">
                        <label class="form-label">Tên sản phẩm</label>
                        <input type="text" class="form-control" id="productName" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Giá</label>
                        <input type="number" class="form-control" id="productPrice" required min="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ảnh (jpg, png)</label>
                        <input type="file" class="form-control" id="productImage" accept="image/png, image/jpeg" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Thêm</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-header">Danh sách sản phẩm</div>
            <div class="card-body">
                <table class="table table-bordered align-middle" id="product-table">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">Đơn hàng đã thanh toán</div>
            <div class="card-body">
                <table class="table table-bordered align-middle" id="order-table">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Khách hàng</th>
                            <th>SĐT</th>
                            <th>Địa chỉ</th>
                            <th>Phương thức</th>
                            <th>Sản phẩm</th>
                            <th>Tổng tiền</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
   
        function getProducts() {
            return JSON.parse(localStorage.getItem('admin_products')) || [];
        }
        function saveProducts(products) {
            localStorage.setItem('admin_products', JSON.stringify(products));
        }
    
        function renderProducts(filter = "") {
            const products = getProducts();
            const tbody = document.querySelector('#product-table tbody');
            let filtered = products;
            if (filter) {
                filtered = products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
            }
            tbody.innerHTML = filtered.map((p, i) => {
                const originalIndex = products.indexOf(p);
                return `
                <tr>
                    <td>${i+1}</td>
                    <td><img src="${p.image}" style="height:50px;object-fit:contain"></td>
                    <td>${p.name}</td>
                    <td>${p.price.toLocaleString()}$</td>
                    <td>
                        <button class="btn btn-primary btn-sm edit-product" data-index="${originalIndex}">Sửa</button>
                        <button class="btn btn-danger btn-sm delete-product" data-index="${originalIndex}">Xóa</button>
                    </td>
                </tr>
            `;
            }).join('');
            document.querySelectorAll('.delete-product').forEach(btn => {
                btn.onclick = function() {
                    products.splice(this.dataset.index, 1);
                    saveProducts(products);
                    renderProducts(document.getElementById('product-search').value);
                }
            });
     
            document.querySelectorAll('.editable').forEach(span => {
                span.onclick = function() {
                    const idx = this.dataset.index;
                    const field = this.dataset.field;
                    const oldValue = field === 'price' ? products[idx][field] : products[idx][field];
                    const input = document.createElement('input');
                    input.type = field === 'price' ? 'number' : 'text';
                    input.value = field === 'price' ? products[idx][field] : products[idx][field];
                    input.className = 'form-control form-control-sm';
                    input.onblur = function() {
                        if (field === 'price') {
                            products[idx][field] = parseFloat(input.value) || 0;
                        } else {
                            products[idx][field] = input.value;
                        }
                        saveProducts(products);
                        renderProducts(document.getElementById('product-search').value);
                    };
                    this.replaceWith(input);
                    input.focus();
                };
            });

            document.querySelectorAll('.edit-product').forEach(btn => {
                btn.onclick = function() {
                    const idx = this.dataset.index;
                    const products = getProducts();
                    document.getElementById('editProductIndex').value = idx;
                    document.getElementById('editProductName').value = products[idx].name;
                    document.getElementById('editProductPrice').value = products[idx].price;
                    document.getElementById('editProductImage').value = '';
                    const modal = new bootstrap.Modal(document.getElementById('editProductModal'));
                    modal.show();
                }
            });
        }
     
        const productSearch = document.createElement('input');
        productSearch.type = 'text';
        productSearch.className = 'form-control mb-2';
        productSearch.placeholder = 'Tìm kiếm sản phẩm...';
        productSearch.id = 'product-search';
        document.querySelector('#product-table').parentElement.prepend(productSearch);
        productSearch.oninput = function() {
            renderProducts(this.value);
        };
        renderProducts();
        document.getElementById('add-product-form').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('productName').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const imageInput = document.getElementById('productImage');
            const file = imageInput.files[0];
            if (!name || isNaN(price) || !file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const imageData = evt.target.result; // base64
                const products = getProducts();
                products.push({ name, price, image: imageData });
                saveProducts(products);
                renderProducts();
                document.getElementById('add-product-form').reset();
            };
            reader.readAsDataURL(file);
        };
        renderProducts();
       
        function getOrders() {
            return JSON.parse(localStorage.getItem('orders')) || [];
        }
    
        function renderOrders(filter = "") {
            const orders = getOrders();
            const tbody = document.querySelector('#order-table tbody');
            let filtered = orders;
            if (filter) {
                filtered = orders.filter(o =>
                    o.customerName.toLowerCase().includes(filter.toLowerCase()) ||
                    o.customerPhone.includes(filter) ||
                    o.customerAddress.toLowerCase().includes(filter.toLowerCase()) ||
                    o.cart.some(item => item.title && item.title.toLowerCase().includes(filter.toLowerCase()))
                );
            }
            tbody.innerHTML = filtered.map((o, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td>${o.customerName}</td>
                    <td>${o.customerPhone}</td>
                    <td>${o.customerAddress}</td>
                    <td>${o.paymentMethod}</td>
                    <td>${o.cart.map(item => `<div>${item.title} x${item.quantity}</div>`).join('')}</td>
                    <td>${o.total.toLocaleString()}$</td>
                </tr>
            `).join('');
        }
       
        const orderSearch = document.createElement('input');
        orderSearch.type = 'text';
        orderSearch.className = 'form-control mb-2';
        orderSearch.placeholder = 'Tìm kiếm đơn hàng...';
        orderSearch.id = 'order-search';
        document.querySelector('#order-table').parentElement.prepend(orderSearch);
        orderSearch.oninput = function() {
            renderOrders(this.value);
        };
        renderOrders();
    
        function saveOrder(order) {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));
        }

        if (!document.getElementById('editProductModal')) {
            const modalHtml = `
            <div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="editProductModalLabel">Sửa sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                    <form id="edit-product-form">
                      <input type="hidden" id="editProductIndex">
                      <div class="mb-3">
                        <label class="form-label">Tên sản phẩm</label>
                        <input type="text" class="form-control" id="editProductName" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Giá</label>
                        <input type="number" class="form-control" id="editProductPrice" required min="0">
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Ảnh (jpg, png, để trống nếu không đổi)</label>
                        <input type="file" class="form-control" id="editProductImage" accept="image/png, image/jpeg">
                      </div>
                      <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        document.getElementById('edit-product-form').onsubmit = function(e) {
            e.preventDefault();
            const idx = document.getElementById('editProductIndex').value;
            const name = document.getElementById('editProductName').value.trim();
            const price = parseFloat(document.getElementById('editProductPrice').value);
            const imageInput = document.getElementById('editProductImage');
            const file = imageInput.files[0];
            const products = getProducts();
            if (!name || isNaN(price)) return;
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    products[idx].image = evt.target.result;
                    products[idx].name = name;
                    products[idx].price = price;
                    saveProducts(products);
                    renderProducts(document.getElementById('product-search').value);
                    bootstrap.Modal.getInstance(document.getElementById('editProductModal')).hide();
                };
                reader.readAsDataURL(file);
            } else {
                products[idx].name = name;
                products[idx].price = price;
                saveProducts(products);
                renderProducts(document.getElementById('product-search').value);
                bootstrap.Modal.getInstance(document.getElementById('editProductModal')).hide();
            }
        }
    
    </script>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
